<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日本蜜月行程管家 (終極完整版)</title>
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- React & Firebase -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.330.0?bundle",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      }
    }
  </script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    body { background-color: #fdf2f8; user-select: none; -webkit-tap-highlight-color: transparent; }
    input, textarea { user-select: text; }
    
    /* Loader */
    #initial-loader {
      position: fixed; inset: 0; background: #fff0f5; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #fbcfe8;
      border-top-color: #db2777; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="initial-loader">
    <div class="spinner"></div>
    <p class="mt-4 text-pink-600 font-bold animate-pulse">正在載入行程管家終極版...</p>
  </div>

  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useCallback, memo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      Calendar, MapPin, Utensils, CloudSun, ClipboardList, Ticket, 
      Plus, Trash2, Navigation, Heart, Edit2, CheckCircle, 
      ExternalLink, Loader2, RefreshCw, Image as ImageIcon, X,
      Languages, Sparkles, Cloud, ThermometerSun, Save, Calculator, Percent, AlertCircle, WifiOff, Users, ChevronDown, ChevronRight, RotateCcw, AlertTriangle, FileQuestion, LocateFixed, Camera, PenTool, GripVertical, Route, Plane, BedDouble
    } from 'lucide-react';

    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from 'firebase/auth';
    import { getFirestore, doc, setDoc, onSnapshot, getDoc } from 'firebase/firestore';

    // AI API Key (De-identified)
    const _k_part1 = "AIzaSy";
    const _k_part2 = "BB0CxGCZWpE";
    const _k_part3 = "2d_GrAwiWR0";
    const _k_part4 = "IhmSmmN8_ZQ";
    const apiKey = `${_k_part1}${_k_part2}${_k_part3}${_k_part4}`;
    
    // Firebase Config (trevel-b526e)
    const firebaseConfig = {
      apiKey: "AIzaSyDGdudzKCHGhLJ0DLL7J5TnUIkEiqIlqjc",
      authDomain: "trevel-b526e.firebaseapp.com",
      projectId: "trevel-b526e",
      storageBucket: "trevel-b526e.firebasestorage.app",
      messagingSenderId: "174104732243",
      appId: "1:174104732243:web:5f38916efa6799e9c6dca6",
      measurementId: "G-29LLWF96VZ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'default-honeymoon-app';

    const EXCHANGE_RATE = 0.21; 

    // --- AI Helper ---
    const fetchGemini = async (prompt, systemPrompt = "", setStatus) => {
      // 🚀 切換至更強大的 gemini-2.5-pro 模型
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent?key=${apiKey}`;
      
      if(setStatus) setStatus("正在連線 AI 模型...");
      
      let delay = 1000;
      for (let i = 0; i < 3; i++) {
        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] },
              generationConfig: { responseMimeType: "application/json" }
            })
          });
          
          if (!response.ok) {
              const errData = await response.json();
              throw new Error(`AI API Error: ${errData.error?.message || response.statusText}`);
          }

          if(setStatus) setStatus("AI 正在思考並撰寫 JSON...");
          
          const data = await response.json();
          let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (!text) throw new Error("AI 回傳內容為空");

          if(setStatus) setStatus("正在解析資料...");
          
          let parsed;
          try {
              const cleanText = text.replace(/^```json\s*/g, "").replace(/^```\s*/g, "").replace(/```$/g, "").trim();
              parsed = JSON.parse(cleanText);
          } catch(e) {
              const arrayMatch = text.match(/\[[\s\S]*\]/);
              if (arrayMatch) {
                  try { parsed = JSON.parse(arrayMatch[0]); } catch(err) {}
              }
              if (!parsed) {
                  const objectMatch = text.match(/\{[\s\S]*\}/);
                  if (objectMatch) {
                      try { parsed = JSON.parse(objectMatch[0]); } catch(err) {}
                  }
              }
          }
          
          if (!parsed) throw new Error("無法從 AI 的回覆中解析出有效的 JSON 資料");
          
          if (prompt.includes("規劃") && prompt.includes("行程")) {
              if (!Array.isArray(parsed) && typeof parsed === 'object') {
                  const keys = Object.keys(parsed);
                  let foundArray = null;
                  for (const key of keys) {
                      if (Array.isArray(parsed[key])) {
                          foundArray = parsed[key];
                          break;
                      }
                  }
                  parsed = foundArray || [parsed];
              } else if (!Array.isArray(parsed)) {
                  parsed = [];
              }
          }

          return parsed;

        } catch (error) {
          console.warn(`Attempt ${i+1} failed:`, error);
          if (i === 2) throw error;
          if(setStatus) setStatus(`連線不穩，重試中 (${i+1}/3)...`);
          await new Promise(r => setTimeout(r, delay));
          delay *= 1.5;
        }
      }
    };

    // --- COMPONENTS ---

    // === 機酒分頁組件 ===
    const BookingsTab = memo(({ flights, setFlights, hotels, setHotels }) => {
       const [showFlightModal, setShowFlightModal] = useState(false);
       const [showHotelModal, setShowHotelModal] = useState(false);
       const [fForm, setFForm] = useState({ date: '', flightNo: '', depTime: '', depAirport: '', arrTime: '', arrAirport: '' });
       const [hForm, setHForm] = useState({ checkIn: '', checkOut: '', name: '', address: '', bookingId: '' });

       const addFlight = () => {
           setFlights(p => [...p, { id: Date.now(), ...fForm }]);
           setShowFlightModal(false);
           setFForm({ date: '', flightNo: '', depTime: '', depAirport: '', arrTime: '', arrAirport: '' });
       };

       const addHotel = () => {
           setHotels(p => [...p, { id: Date.now(), ...hForm }]);
           setShowHotelModal(false);
           setHForm({ checkIn: '', checkOut: '', name: '', address: '', bookingId: '' });
       };

       return (
         <div className="space-y-6 animate-in slide-in-from-right duration-300">
            <div className="bg-white p-5 rounded-2xl shadow-sm text-center relative overflow-hidden border border-blue-100">
               <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-400 to-indigo-500"></div>
               <h2 className="text-lg font-bold flex items-center justify-center gap-2 text-blue-700">
                  <Plane className="w-5 h-5" /> 航班與住宿管理
               </h2>
               <p className="text-xs text-slate-500 mt-1">統一管理已預訂的機票與飯店資訊</p>
               <div className="flex gap-2 mt-4">
                  <button onClick={() => setShowFlightModal(true)} className="flex-1 bg-blue-50 text-blue-600 py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-1 hover:bg-blue-100 transition"><Plane className="w-4 h-4"/> 新增航班</button>
                  <button onClick={() => setShowHotelModal(true)} className="flex-1 bg-indigo-50 text-indigo-600 py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-1 hover:bg-indigo-100 transition"><BedDouble className="w-4 h-4"/> 新增住宿</button>
               </div>
            </div>

            {flights.length > 0 && (
                <div className="space-y-3">
                    <h3 className="font-bold text-slate-700 flex items-center gap-2"><Plane className="w-4 h-4 text-blue-500"/> 航班資訊</h3>
                    {flights.map(f => (
                        <div key={f.id} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 relative group">
                            <button onClick={()=>setFlights(p=>p.filter(x=>x.id!==f.id))} className="absolute top-2 right-2 text-slate-300 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                            <div className="flex justify-between items-center mb-2">
                                <span className="text-sm font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded">{f.date}</span>
                                <span className="font-mono font-bold text-slate-700 mr-6">{f.flightNo}</span>
                            </div>
                            <div className="flex justify-between items-center mt-3">
                                <div className="text-center flex-1">
                                    <p className="text-xl font-bold">{f.depTime}</p>
                                    <p className="text-xs text-slate-500">{f.depAirport}</p>
                                </div>
                                <div className="text-slate-300 px-2">➔</div>
                                <div className="text-center flex-1">
                                    <p className="text-xl font-bold">{f.arrTime}</p>
                                    <p className="text-xs text-slate-500">{f.arrAirport}</p>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            )}

            {hotels.length > 0 && (
                <div className="space-y-3">
                    <h3 className="font-bold text-slate-700 flex items-center gap-2 mt-2"><BedDouble className="w-4 h-4 text-indigo-500"/> 住宿資訊</h3>
                    {hotels.map(h => (
                        <div key={h.id} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 relative group border-l-4 border-l-indigo-400">
                            <button onClick={()=>setHotels(p=>p.filter(x=>x.id!==h.id))} className="absolute top-2 right-2 text-slate-300 hover:text-red-500"><Trash2 className="w-4 h-4"/></button>
                            <h4 className="font-bold text-slate-800 pr-6">{h.name}</h4>
                            <div className="text-xs text-slate-500 mt-2 space-y-1">
                                <p className="flex justify-between bg-slate-50 p-1.5 rounded"><span className="font-medium text-slate-600">入住: {h.checkIn}</span> <span className="font-medium text-slate-600">退房: {h.checkOut}</span></p>
                                <p className="flex items-start gap-1 mt-1 cursor-pointer hover:underline text-indigo-500" onClick={() => window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h.name + ' ' + h.address)}`, '_blank')}><MapPin className="w-3 h-3 flex-shrink-0 mt-0.5 text-indigo-400"/> {h.address}</p>
                                {h.bookingId && <p className="font-mono text-indigo-600 bg-indigo-50 inline-block px-2 py-1 rounded mt-1">訂單編號: {h.bookingId}</p>}
                            </div>
                        </div>
                    ))}
                </div>
            )}

            {showFlightModal && (
                <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
                    <div className="bg-white p-5 rounded-3xl w-full max-w-sm">
                        <h3 className="font-bold mb-4 text-lg">新增航班</h3>
                        <div className="space-y-3">
                            <div><label className="text-xs text-slate-400 font-bold ml-1">飛行日期</label><input type="date" value={fForm.date} onChange={e=>setFForm({...fForm, date: e.target.value})} className="w-full p-3 border border-slate-100 bg-slate-50 rounded-xl text-sm outline-none focus:border-blue-300" /></div>
                            <div><label className="text-xs text-slate-400 font-bold ml-1">航班編號</label><input type="text" placeholder="例: BR112" value={fForm.flightNo} onChange={e=>setFForm({...fForm, flightNo: e.target.value})} className="w-full p-3 border border-slate-100 bg-slate-50 rounded-xl text-sm outline-none focus:border-blue-300" /></div>
                            <div className="flex gap-2">
                                <div className="flex-1"><label className="text-xs text-slate-400 font-bold ml-1">起飛時間</label><input type="time" value={fForm.depTime} onChange={e=>setFForm({...fForm, depTime: e.target.value})} className="w-full p-3 border border-slate-100 bg-slate-50 rounded-xl text-sm outline-none focus:border-blue-300" /></div>
                                <div className="flex-1"><label className="text-xs text-slate-400 font-bold ml-1">起飛機場</label><input type="text" placeholder="例: 桃園 TPE" value={fForm.depAirport} onChange={e=>setFForm({...fForm, depAirport: e.target.value})} className="w-full p-3 border border-slate-100 bg-slate-50 rounded-xl text-sm outline-none focus:border-blue-300" /></div>
                            </div>
                            <div className="flex gap-2">
                                <div className="flex-1"><label className="text-xs text-slate-400 font-bold ml-1">抵達時間</label><input type="time" value={fForm.arrTime} onChange={e=>setFForm({...fForm, arrTime: e.target.value})} className="w-full p-3 border border-slate-100 bg-slate-50 rounded-xl text-sm outline-none focus:border-blue-300" /></div>
                                <div className="flex-1"><label className="text-xs text-slate-400 font-bold ml-1">抵達機場</label><input type="text" placeholder="例: 新千歲 CTS" value={fForm.arrAirport} onChange={e=>setFForm({...fForm, arrAirport: e.target.value})} className="w-full p-3 border border-slate-100 bg-slate-50 rounded-xl text-sm outline-none focus:border-blue-300" /></div>
                            </div>
                        </div>
                        <div className="flex gap-2 mt-6">
                            <button onClick={()=>setShowFlightModal(false)} className="flex-1 p-3 bg-slate-100 text-slate-600 rounded-xl font-bold">取消</button>
                            <button onClick={addFlight} className="flex-1 p-3 bg-blue-500 text-white rounded-xl font-bold hover:bg-blue-600">儲存航班</button>
                        </div>
                    </div>
                </div>
            )}
            
            {showHotelModal && (
                <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
                    <div className="bg-white p-5 rounded-3xl w-full max-w-sm">
                        <h3 className="font-bold mb-4 text-lg">新增住宿</h3>
                        <div className="space-y-3">
                            <div><label className="text-xs text-slate-400 font-bold ml-1">飯店名稱</label><input type="text" placeholder="例: 札幌格蘭大飯店" value={hForm.name} onChange={e=>setHForm({...hForm, name: e.target.value})} className="w-full p-3 border border-slate-100 bg-slate-50 rounded-xl text-sm outline-none focus:border-indigo-300" /></div>
                            <div className="flex gap-2">
                                <div className="flex-1"><label className="text-xs text-slate-400 font-bold ml-1">入住日期</label><input type="date" value={hForm.checkIn} onChange={e=>setHForm({...hForm, checkIn: e.target.value})} className="w-full p-3 border border-slate-100 bg-slate-50 rounded-xl text-sm outline-none focus:border-indigo-300" /></div>
                                <div className="flex-1"><label className="text-xs text-slate-400 font-bold ml-1">退房日期</label><input type="date" value={hForm.checkOut} onChange={e=>setHForm({...hForm, checkOut: e.target.value})} className="w-full p-3 border border-slate-100 bg-slate-50 rounded-xl text-sm outline-none focus:border-indigo-300" /></div>
                            </div>
                            <div><label className="text-xs text-slate-400 font-bold ml-1">地址/導航用</label><input type="text" placeholder="飯店地址" value={hForm.address} onChange={e=>setHForm({...hForm, address: e.target.value})} className="w-full p-3 border border-slate-100 bg-slate-50 rounded-xl text-sm outline-none focus:border-indigo-300" /></div>
                            <div><label className="text-xs text-slate-400 font-bold ml-1">訂單編號 (選填)</label><input type="text" placeholder="Booking/Agoda Ref" value={hForm.bookingId} onChange={e=>setHForm({...hForm, bookingId: e.target.value})} className="w-full p-3 border border-slate-100 bg-slate-50 rounded-xl text-sm outline-none focus:border-indigo-300 font-mono" /></div>
                        </div>
                        <div className="flex gap-2 mt-6">
                            <button onClick={()=>setShowHotelModal(false)} className="flex-1 p-3 bg-slate-100 text-slate-600 rounded-xl font-bold">取消</button>
                            <button onClick={addHotel} className="flex-1 p-3 bg-indigo-500 text-white rounded-xl font-bold hover:bg-indigo-600">儲存住宿</button>
                        </div>
                    </div>
                </div>
            )}
         </div>
       );
    });

    const WeatherCard = memo(({ info, onDelete }) => (
      <div className="bg-gradient-to-br from-blue-400 to-blue-600 rounded-2xl p-5 text-white shadow-md relative overflow-hidden mb-4 animate-in slide-in-from-top-2">
        <button onClick={() => onDelete(info.id)} className="absolute top-2 right-2 text-white/80 hover:text-white bg-white/20 rounded-full p-1"><X className="w-4 h-4"/></button>
        <div className="flex justify-between items-start mb-3">
            <div>
                <h3 className="text-xl font-bold flex items-center gap-2">{info.location}</h3>
                <span className="text-sm opacity-90">{info.temp}</span>
            </div>
            <CloudSun className="w-10 h-10 opacity-80" />
        </div>
        
        <div className="space-y-2">
            <div className="bg-white/20 p-2 rounded-lg">
                <span className="text-xs font-bold block opacity-70 mb-1">🌤 氣候</span>
                <p className="text-sm leading-tight">{info.weather}</p>
            </div>
            <div className="bg-white/20 p-2 rounded-lg">
                <span className="text-xs font-bold block opacity-70 mb-1">👕 建議穿搭</span>
                <p className="text-sm leading-tight">{info.clothing}</p>
            </div>
            <div className="bg-white/20 p-2 rounded-lg">
                <span className="text-xs font-bold block opacity-70 mb-1">⚠️ 注意事項</span>
                <p className="text-sm leading-tight">{info.notes}</p>
            </div>
        </div>
      </div>
    ));

    const DaySection = memo(({ day, dIdx, currentTripId, updateEvent, addEvent, deleteEvent, handleDragStart, handleDragEnter, handleDragEnd, handleDragOver, draggingId, updateDayWishlist, optimizeDayRoute }) => {
        const [isExpanded, setIsExpanded] = useState(true);
        const [isOptimizing, setIsOptimizing] = useState(false);

        // 生成 Google 地圖導航路線
        const openGoogleMaps = () => {
            const validEvents = (day.events || []).filter(e => e.location && e.location.trim() !== '');
            if (validEvents.length === 0) {
                alert("請先填寫景點或餐廳的位置，才能產生路線喔！");
                return;
            }
            if (validEvents.length === 1) {
                window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(validEvents[0].location)}`, '_blank');
                return;
            }

            const origin = encodeURIComponent(validEvents[0].location);
            const destination = encodeURIComponent(validEvents[validEvents.length - 1].location);
            let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}`;
            
            if (validEvents.length > 2) {
                const waypoints = validEvents.slice(1, -1).map(e => encodeURIComponent(e.location)).join('|');
                url += `&waypoints=${waypoints}`;
            }
            window.open(url, '_blank');
        };

        const handleAIReorder = async () => {
            setIsOptimizing(true);
            await optimizeDayRoute(currentTripId, dIdx, day.events, day.wishlistText);
            setIsOptimizing(false);
        };

        return (
            <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden mb-4">
                <div 
                    className="bg-pink-50/50 p-3 flex justify-between items-center cursor-pointer select-none"
                    onClick={() => setIsExpanded(!isExpanded)}
                >
                    <div className="flex items-center gap-2">
                        {isExpanded ? <ChevronDown className="w-4 h-4 text-pink-400" /> : <ChevronRight className="w-4 h-4 text-pink-400" />}
                        <h3 className="font-bold text-slate-800 flex flex-col sm:flex-row sm:gap-2 text-sm sm:text-base">
                            <span className="text-pink-600">Day {day.day}</span>
                            <span className="font-normal text-slate-500">{day.date} - {day.title}</span>
                        </h3>
                    </div>
                </div>
                
                {isExpanded && (
                    <div className="p-4 relative">
                        <div className="absolute left-[27px] top-4 bottom-4 w-0.5 bg-slate-100"></div>
                        
                        {(!day.events || day.events.length === 0) && (
                            <div 
                                onDragEnter={(e) => handleDragEnter(e, dIdx, 0)}
                                onDragOver={handleDragOver}
                                className="text-center py-8 text-slate-400 border-2 border-dashed border-slate-200 rounded-xl mb-4 bg-slate-50 text-sm"
                            >
                                拖曳行程至此，或點擊下方按鈕新增
                            </div>
                        )}

                        {(day.events || []).map((event, eIdx) => (
                            <div 
                                key={eIdx} 
                                draggable
                                onDragStart={(e) => handleDragStart(e, dIdx, eIdx)}
                                onDragEnter={(e) => handleDragEnter(e, dIdx, eIdx)}
                                onDragEnd={handleDragEnd}
                                onDragOver={handleDragOver}
                                className={`flex gap-4 relative mb-6 last:mb-0 group transition-all ${draggingId === `${dIdx}-${eIdx}` ? 'opacity-30 scale-95' : ''}`}
                            >
                                <div className="w-12 flex-shrink-0 flex flex-col items-end pt-1 z-10 bg-white">
                                    <input 
                                        type="text" 
                                        value={event.time || ''} 
                                        onChange={(e) => updateEvent(currentTripId, dIdx, eIdx, 'time', e.target.value)}
                                        className="text-xs font-bold text-slate-400 w-full text-right focus:text-pink-500 focus:outline-none bg-transparent"
                                        placeholder="時間"
                                    />
                                </div>
                                <div className="absolute left-[11px] top-2 w-2.5 h-2.5 rounded-full bg-pink-300 border-2 border-white shadow-sm z-20"></div>
                                <div className="flex-grow bg-slate-50/50 rounded-xl p-3 pl-8 border border-slate-100 hover:border-pink-200 hover:shadow-sm transition-all group-hover:bg-white relative">

                        <button

    const NewPlannerTab = memo(({ trips, selectedTripId, setSelectedTripId, deleteTrip, onAddTrip, loading, loadingStatus, updateEvent, addEvent, deleteEvent, reorderEvent, updateDayWishlist, optimizeDayRoute }) => {
        const [showModal, setShowModal] = useState(false);
        const [form, setForm] = useState({ location: '北海道', days: 5, startDate: '2026-03-04', arrivalTime: '14:00' });

        const dragItem = useRef(null);
        const dragOverItem = useRef(null);
        const [draggingId, setDraggingId] = useState(null);

        const handleDragStart = (e, dayIdx, eventIdx) => {
            dragItem.current = { dayIdx, eventIdx };
            setDraggingId(`${dayIdx}-${eventIdx}`);
            e.dataTransfer.effectAllowed = "move";
        };

        const handleDragEnter = (e, dayIdx, eventIdx) => {
            e.preventDefault();
            dragOverItem.current = { dayIdx, eventIdx };
        };

        const handleDragEnd = (e) => {
            setDraggingId(null);
            if (dragItem.current && dragOverItem.current) {
                if (dragItem.current.dayIdx !== dragOverItem.current.dayIdx ||
                    dragItem.current.eventIdx !== dragOverItem.current.eventIdx) {
                    reorderEvent(
                        selectedTripId,
                        dragItem.current.dayIdx,
                        dragItem.current.eventIdx,
                        dragOverItem.current.dayIdx,
                        dragOverItem.current.eventIdx
                    );
                }
            }
            dragItem.current = null;
            dragOverItem.current = null;
        };

        const handleDragOver = (e) => {
            e.preventDefault(); 
            e.dataTransfer.dropEffect = "move";
        };

        const handleCreate = () => {
            onAddTrip(form.location, form.days, form.startDate, form.arrivalTime, () => setShowModal(false));
        };

        if (!trips || trips.length === 0) {
            return (
                <div className="flex flex-col items-center justify-center h-[70vh] px-4 text-center animate-in fade-in">

                                </div>
                                <div className="flex-1">
                                    <label className="text-xs text-slate-400 font-bold ml-1">開始日期</label>

                        </button>
                    </div>
                </div>
            );

        const currentTrip = trips.find(t => t.id === selectedTripId) || trips[0];

        return (
            <div className="animate-in fade-in pb-20">
                <div className="flex items-center gap-2 overflow-x-auto pb-2 mb-4 no-scrollbar">
                    {trips.map(trip => (
                        <button key={trip.id} onClick={() => setSelectedTripId(trip.id)} className={`flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition border ${selectedTripId === trip.id ? 'bg-pink-500 text-white border-pink-500' : 'bg-white text-slate-600 border-slate-200'}`}>
                            {trip.location}
                            {selectedTripId === trip.id && <X className="w-3 h-3 ml-1 opacity-70 hover:opacity-100" onClick={(e)=>{e.stopPropagation(); if(confirm('刪除此行程?')) deleteTrip(trip.id)}} />}
                        </button>

                    <button onClick={() => setShowModal(true)} className="flex-shrink-0 px-3 py-2 rounded-full bg-white border border-dashed border-pink-300 text-pink-500 text-sm font-medium flex items-center gap-1 hover:bg-pink-50">
                        <Plus className="w-4 h-4" /> 新行程
                    </button>
                </div>

                <div className="space-y-4">
                    {currentTrip?.itineraryData?.map((day, idx) => (
                        <DaySection 
                            key={`${currentTrip.id}-${idx}`}
                            day={day}
                            dIdx={idx}
                            currentTripId={currentTrip.id}
                            updateEvent={updateEvent}
                            addEvent={addEvent}
                            deleteEvent={deleteEvent}
                            handleDragStart={handleDragStart}
                            handleDragEnter={handleDragEnter}
                            handleDragEnd={handleDragEnd}
                            handleDragOver={handleDragOver}
                            draggingId={draggingId}
                            updateDayWishlist={updateDayWishlist}
                            optimizeDayRoute={optimizeDayRoute}
                        />
                    ))}
                </div>

                {showModal && (
                    <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
                        <div className="bg-white p-6 rounded-3xl w-full max-w-sm">
                            <h3 className="font-bold text-lg mb-4">新增城市行程</h3>
                            <div className="space-y-3 mb-4">
                                <input type="text" placeholder="城市" value={form.location} onChange={e=>setForm({...form, location: e.target.value})} className="w-full p-3 border rounded-xl" />
                                <div className="flex gap-2">
                                    <input type="number" placeholder="天數" value={form.days} onChange={e=>setForm({...form, days: e.target.value})} className="w-full p-3 border rounded-xl" />
                                    <input type="date" value={form.startDate} onChange={e=>setForm({...form, startDate: e.target.value})} className="w-full p-3 border rounded-xl" />
                                </div>
                                <div>
                                    <label className="text-xs text-slate-400 font-bold ml-1">抵達時間 (選填)</label>
                                    <input type="time" placeholder="第一天抵達時間" value={form.arrivalTime} onChange={e=>setForm({...form, arrivalTime: e.target.value})} className="w-full p-3 border rounded-xl" />
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={()=>setShowModal(false)} disabled={loading} className="flex-1 p-3 bg-slate-100 rounded-xl text-slate-500">取消</button>
                                <button onClick={handleCreate} disabled={loading} className="flex-1 p-3 bg-pink-500 text-white rounded-xl font-bold flex justify-center items-center gap-2">
                                    {loading ? <Loader2 className="animate-spin w-4 h-4"/> : "生成"}
                                </button>
                            </div>
                            {loading && <p className="text-xs text-pink-500 text-center mt-2 animate-pulse">{loadingStatus}</p>}
                        </div>
                    </div>
                )}
            </div>
        );
    });

    const FoodTab = memo(({ getNearbyFood, getNearbySpots, loading, nearbyFood, foodStatus, exploreMode, setExploreMode }) => (
      <div className="space-y-4 animate-in slide-in-from-right duration-300">
        <div className="bg-white p-5 rounded-2xl shadow-sm space-y-3 text-center relative overflow-hidden">
          <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-300 to-orange-500"></div>
          <h2 className="text-lg font-bold flex items-center justify-center gap-2 text-orange-600"><MapPin className="w-5 h-5" /> 探索周邊 (美食 & 景點)</h2>
          
          <div className="flex gap-2">

        <div className="grid gap-3">

                <button 
                    onClick={() => window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + (item.address || ''))}`, '_blank')}
                    className={`text-xs flex items-center gap-1 hover:underline px-2 py-1 rounded-full w-fit mt-2 ${item.type === 'spot' ? 'text-purple-600 bg-purple-50' : 'text-blue-500 bg-blue-50'}`}
                >
                  <MapPin className="w-3 h-3" /> 導航前往
                </button>

          {nearbyFood.length === 0 && !loading && (
             <div className="text-center text-slate-400 py-10 bg-white rounded-2xl border border-dashed border-slate-200">

             </div>

    const PrepTab = memo(({ packingList, setPackingList, deletePackingItem, newItemText, setNewItemText, addPackingItem, memos, setMemos, suggestPackingItems, suggestingItems, weatherInfos, addWeatherLocation, isAddingWeather, deleteWeatherLocation, onGenerateJournal, journalLoading }) => {
      const [weatherCity, setWeatherCity] = useState('');
      const [journalKeywords, setJournalKeywords] = useState('');

      return (
        <div className="space-y-6 animate-in slide-in-from-right duration-300">
          <section>
             <div className="flex justify-between items-center mb-3">
               <h2 className="text-lg font-bold flex items-center gap-2 text-blue-600"><ThermometerSun className="w-5 h-5" /> 城市氣候指南</h2>
             </div>
             {weatherInfos && weatherInfos.map(info => (
                <WeatherCard key={info.id} info={info} onDelete={deleteWeatherLocation} />
             ))}
             <div className="flex gap-2 bg-white p-3 rounded-2xl shadow-sm border border-blue-100">
               <input 
                 type="text" 
                 placeholder="輸入城市 (如: 京都)" 
                 value={weatherCity}
                 onChange={e => setWeatherCity(e.target.value)}
                 className="flex-grow p-2 text-sm border rounded-xl focus:outline-none focus:border-blue-400"
               />
               <button 
                 onClick={() => { if(weatherCity) { addWeatherLocation(weatherCity); setWeatherCity(''); }}}
                 disabled={isAddingWeather || !weatherCity}
                 className="bg-blue-100 text-blue-600 px-4 rounded-xl text-sm font-bold flex items-center gap-2 hover:bg-blue-200 disabled:opacity-50"
               >
                 {isAddingWeather ? <Loader2 className="w-4 h-4 animate-spin"/> : <Plus className="w-4 h-4"/>} 新增
               </button>
             </div>
          </section>

          <section className="bg-white rounded-2xl shadow-sm p-5 border border-slate-100">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-lg font-bold flex items-center gap-2 text-green-700"><ClipboardList className="w-5 h-5" /> 行前準備清單</h2>
              <button onClick={suggestPackingItems} disabled={suggestingItems} className="bg-green-50 text-green-600 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 hover:bg-green-100 transition disabled:opacity-50">
                {suggestingItems ? <Loader2 className="w-3 h-3 animate-spin" /> : <Sparkles className="w-3 h-3" />} AI 推薦

                  <span className={`flex-grow text-sm transition ${item.checked ? 'line-through text-slate-400' : 'text-slate-700'}`}>{item.text}</span>

                </div>

            <div className="flex gap-2">

              <button onClick={() => setMemos([...memos, { id: Date.now(), text: '' }])} className="p-2 bg-purple-100 text-purple-600 rounded-lg hover:bg-purple-200 transition"><Plus className="w-4 h-4" /></button>
            </div>
            
            <div className="bg-purple-50 p-4 rounded-xl mb-4 border border-purple-100">

                        className="flex-grow p-2 text-sm border rounded-lg focus:outline-none focus:border-purple-400"
                    />

            <div className="space-y-3">
              {memos.map(memo => (

                  <button onClick={() => setMemos(memos.filter(m => m.id !== memo.id))} className="absolute top-2 right-2 p-1 text-purple-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition bg-white rounded-full shadow-sm"><Trash2 className="w-3 h-3" /></button>

    const CouponsTab = memo(({ coupons, setCoupons, showAddCoupon, setShowAddCoupon, newCouponForm, setNewCouponForm, handleImageUpload, currency, handleCurrencyTwd, handleCurrencyJpy }) => {
       const [calcPrice, setCalcPrice] = useState('');
       const [isTaxIncluded, setIsTaxIncluded] = useState(true);
       const [isTaxFree, setIsTaxFree] = useState(false);
       const [discountPercent, setDiscountPercent] = useState('');
       const basePrice = parseFloat(calcPrice) || 0;
       let preDiscountPrice = basePrice;
       if (isTaxIncluded) { if (isTaxFree) preDiscountPrice = basePrice / 1.1; } else { if (!isTaxFree) preDiscountPrice = basePrice * 1.1; }
       const finalJpy = Math.round(preDiscountPrice * (1 - (parseFloat(discountPercent)||0) / 100));
       const finalTwd = Math.round(finalJpy * EXCHANGE_RATE);

       return (
           <div className="space-y-4 animate-in slide-in-from-right duration-300">
             <div className="flex justify-between items-center">
                <h2 className="text-lg font-bold flex items-center gap-2 text-red-600"><Ticket className="w-5 h-5" /> 優惠券錢包</h2>
                <button onClick={() => setShowAddCoupon(true)} className="bg-red-100 text-red-600 px-3 py-1.5 rounded-full text-sm font-bold flex items-center gap-1"><Plus className="w-4 h-4"/> 新增</button>
             </div>
             {showAddCoupon && (
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-red-100 space-y-2">
                    <input type="text" placeholder="標題" className="w-full p-2 border rounded" value={newCouponForm.title} onChange={e=>setNewCouponForm({...newCouponForm, title: e.target.value})} />
                    <input type="text" placeholder="代碼" className="w-full p-2 border rounded" value={newCouponForm.code} onChange={e=>setNewCouponForm({...newCouponForm, code: e.target.value})} />
                    <input type="file" onChange={handleImageUpload} className="text-sm" />
                    <div className="flex gap-2">
                        <button onClick={()=>setShowAddCoupon(false)} className="flex-1 p-2 bg-slate-100 rounded">取消</button>
                        <button onClick={()=>{ setCoupons(p=>[...p, {id: Date.now(), ...newCouponForm}]); setShowAddCoupon(false); }} className="flex-1 p-2 bg-red-500 text-white rounded">儲存</button>
                    </div>
                </div>
             )}
             {coupons.map(c => (
                 <div key={c.id} className="bg-white p-4 rounded-2xl border border-red-100 relative">
                    <button onClick={()=>setCoupons(p=>p.filter(x=>x.id!==c.id))} className="absolute top-2 right-2 text-slate-300"><Trash2 className="w-4 h-4"/></button>
                    {c.image && <img src={c.image} className="w-full h-32 object-cover rounded-lg mb-2" />}
                    <h3 className="font-bold">{c.title}</h3>
                    <p className="font-mono text-red-500 bg-red-50 p-2 text-center rounded mt-2 select-all">{c.code}</p>
                 </div>
             ))}
             <hr className="border-slate-200 my-4"/>
             <div className="bg-white rounded-2xl p-5 shadow-sm border border-blue-100">
                <h3 className="font-bold mb-4 flex items-center gap-2 text-slate-700"><Calculator className="w-5 h-5 text-blue-500" /> 購物折扣計算機</h3>
                <div className="space-y-4">
                    <div><label className="text-xs text-slate-500 font-bold ml-1">商品標價 (JPY)</label><input type="number" value={calcPrice} onChange={e => setCalcPrice(e.target.value)} placeholder="0" className="w-full p-3 bg-slate-50 rounded-xl text-lg font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-200" /></div>
                    <div className="flex justify-between gap-2">
                        <button onClick={() => setIsTaxIncluded(!isTaxIncluded)} className={`flex-1 py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 border ${isTaxIncluded ? 'bg-blue-500 text-white border-blue-500' : 'bg-white text-slate-400 border-slate-200'}`}>{isTaxIncluded ? <CheckCircle className="w-3 h-3"/> : <div className="w-3 h-3 rounded-full border border-current"/>} 標價含稅</button>
                        <button onClick={() => setIsTaxFree(!isTaxFree)} className={`flex-1 py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 border ${isTaxFree ? 'bg-green-500 text-white border-green-500' : 'bg-white text-slate-400 border-slate-200'}`}>{isTaxFree ? <CheckCircle className="w-3 h-3"/> : <div className="w-3 h-3 rounded-full border border-current"/>} 免稅 (10%)</button>
                    </div>
                    <div className="flex items-center gap-3"><div className="flex-1"><label className="text-xs text-slate-500 font-bold ml-1">額外折扣 %</label><div className="relative"><input type="number" value={discountPercent} onChange={e => setDiscountPercent(e.target.value)} placeholder="0" className="w-full p-3 bg-slate-50 rounded-xl font-bold focus:outline-none focus:ring-2 focus:ring-red-200 text-red-500" /><Percent className="w-4 h-4 text-slate-400 absolute right-3 top-1/2 -translate-y-1/2" /></div></div></div>
                    <div className="bg-slate-800 rounded-xl p-4 text-white"><div className="flex justify-between items-end mb-2"><span className="text-xs text-slate-400">最終入手價</span><span className="text-2xl font-bold text-yellow-400">¥ {finalJpy.toLocaleString()}</span></div><div className="flex justify-between items-center pt-2 border-t border-slate-700"><span className="text-xs text-slate-400">預估台幣</span><span className="font-mono">NT$ {finalTwd.toLocaleString()}</span></div></div>
                </div>
             </div>
             <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mt-4"><h3 className="font-bold mb-3 flex items-center gap-2 text-sm text-slate-700"><RefreshCw className="w-4 h-4 text-slate-400" /> 簡易雙向換算 (匯率 {EXCHANGE_RATE})</h3><div className="flex gap-3 items-center"><div className="flex-1 relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-slate-400">TWD</span><input type="number" value={currency.twd} onChange={(e) => handleCurrencyTwd(e.target.value)} className="w-full pl-12 p-2 bg-slate-50 rounded-xl focus:outline-none text-sm font-medium" /></div><span className="text-slate-400">≈</span><div className="flex-1 relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-blue-500">JPY</span><input type="number" value={currency.jpy} onChange={(e) => handleCurrencyJpy(e.target.value)} className="w-full pl-12 p-2 bg-blue-50 text-blue-700 font-bold rounded-xl text-sm focus:outline-none" /></div></div></div>
           </div>
       );
    });

    const TranslateTab = memo(({ transInput, setTransInput, handleTranslate, translating, transResult }) => (
        <div className="space-y-6 animate-in slide-in-from-right duration-300">
          <div className="bg-indigo-600 rounded-3xl p-6 text-white shadow-lg relative overflow-hidden">
             <Languages className="absolute right-[-20px] top-[-20px] w-32 h-32 opacity-10" />
             <h2 className="text-xl font-bold mb-2 flex items-center gap-2">AI 隨身日語翻譯</h2>
             <p className="text-indigo-100 text-sm">輸入中文，立刻轉為自然、有禮貌的日語。</p>
          </div>
          <div className="bg-white rounded-2xl shadow-sm p-4 border border-slate-100 space-y-4">
            <div><label className="text-xs font-bold text-slate-400 mb-1 block">中文輸入</label><textarea value={transInput} onChange={(e) => setTransInput(e.target.value)} placeholder="例如：請問這個多少錢？ / 我對蝦子過敏。" className="w-full p-4 bg-slate-50 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-indigo-200 resize-none h-24"/></div>
            <button onClick={handleTranslate} disabled={translating || !transInput} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-indigo-700 transition disabled:opacity-50">{translating ? <Loader2 className="animate-spin w-5 h-5" /> : <Sparkles className="w-5 h-5" />} 翻譯成日語</button>
          </div>
          {transResult && (
            <div className="bg-white rounded-2xl shadow-sm p-6 border-l-4 border-indigo-500 animate-in fade-in slide-in-from-bottom-2">
              <div className="mb-4"><p className="text-xs text-slate-400 font-bold mb-1">日語 (Polite)</p><p className="text-2xl font-bold text-slate-800">{transResult.japanese}</p></div>
              <div className="bg-slate-50 p-3 rounded-lg"><p className="text-xs text-slate-400 font-bold mb-1">發音 (Romaji)</p><p className="text-sm font-mono text-indigo-600 font-medium">{transResult.romaji}</p></div>
            </div>
          )}
        </div>
    ));

    // --- MAIN APP ---
    const App = () => {
      const [activeTab, setActiveTab] = useState('planner');
      const [status, setStatus] = useState('loading');
      const [errorMsg, setErrorMsg] = useState('');
      const [user, setUser] = useState(null);
      
      const [trips, setTrips] = useState([]);
      const [selectedTripId, setSelectedTripId] = useState(null);
      
      const [memos, setMemos] = useState([]);
      const [packingList, setPackingList] = useState([]);
      const [coupons, setCoupons] = useState([]);
      const [weatherInfos, setWeatherInfos] = useState([]);
      const [flights, setFlights] = useState([]);
      const [hotels, setHotels] = useState([]);
      
      const [newItemText, setNewItemText] = useState('');
      const [suggestingItems, setSuggestingItems] = useState(false);
      const [isAddingWeather, setIsAddingWeather] = useState(false);
      const [showAddCoupon, setShowAddCoupon] = useState(false);
      const [newCouponForm, setNewCouponForm] = useState({ title: '', code: '', description: '', image: null });
      const [nearbyFood, setNearbyFood] = useState([]);
      const [foodLoading, setFoodLoading] = useState(false);
      const [foodStatus, setFoodStatus] = useState('');
      const [transInput, setTransInput] = useState('');
      const [transResult, setTransResult] = useState(null);
      const [translating, setTranslating] = useState(false);
      const [currency, setCurrency] = useState({ twd: 100, jpy: 0 });
      const [exploreMode, setExploreMode] = useState('food');
      
      const [tripLoading, setTripLoading] = useState(false);
      const [tripStatus, setTripStatus] = useState('');
      const [journalLoading, setJournalLoading] = useState(false);

      const isRemoteUpdate = useRef(false);
      const saveTimeoutRef = useRef(null);

      useEffect(() => {
        document.getElementById('initial-loader')?.remove();
        setCurrency(prev => ({ ...prev, jpy: Math.round(prev.twd / EXCHANGE_RATE) }));
        
        signInAnonymously(auth).catch(e => {
            console.error(e);
            setStatus('error');
            setErrorMsg(`登入失敗: ${e.code}`);
        });

        const unsubAuth = onAuthStateChanged(auth, u => {
            if(u) {
                setUser(u);
                const docRef = doc(db, 'artifacts', appId, 'public', 'shared_data');
                onSnapshot(docRef, (snap) => {
                    setStatus('ready');
                    if (snap.exists()) {
                        const d = snap.data();
                        isRemoteUpdate.current = true;
                        setTrips(d.trips || []);
                        setPackingList(d.packingList || []);
                        setMemos(d.memos || []);
                        setCoupons(d.coupons || []);
                        setWeatherInfos(d.weatherInfos || []);
                        setFlights(d.flights || []);
                        setHotels(d.hotels || []);
                        
                        setSelectedTripId(prev => {
                            if (prev && d.trips?.find(t => t.id === prev)) return prev;
                            return d.trips?.[0]?.id || null;
                        });
                        setTimeout(() => { isRemoteUpdate.current = false; }, 100);
                    } else {
                        setTrips([]);
                    }
                }, err => {
                    console.error(err);
                    setStatus('error');
                    setErrorMsg("無法讀取資料庫，請檢查權限");
                });
            }
        });
        return () => unsubAuth();
      }, []);

      const saveToCloud = useCallback((dataToSave) => {
        if(!user) return;
        setDoc(doc(db, 'artifacts', appId, 'public', 'shared_data'), dataToSave, { merge: true })
          .catch(e => console.error("Save failed", e));
      }, [user]);

      useEffect(() => {
          if (status === 'ready' && !isRemoteUpdate.current) {
              if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
              saveTimeoutRef.current = setTimeout(() => {
                 saveToCloud({ trips, packingList, memos, coupons, weatherInfos, flights, hotels });
              }, 1500);
          }
      }, [status, trips, packingList, memos, coupons, weatherInfos, flights, hotels, saveToCloud]);

      // --- Handlers ---
      const handleAddTrip = async (loc, days, start, arrivalTime, callback) => {
          setTripLoading(true);
          setTripStatus("AI 正在規劃行程...");
          try {
              let promptText = `規劃${start}開始的${days}天${loc}蜜月行程，請安排浪漫、美食與代表性景點。`;
              if (arrivalTime) {
                  promptText += `\n請注意：第一天預計於 ${arrivalTime} 抵達，第一天的行程請從這個時間點之後開始安排。`;
              }

              const systemPrompt = `你是一位專業的日本旅遊規劃師。請務必直接回傳一個 JSON 陣列 (Array)，不要包含其他多餘的文字。格式必須嚴格如下：\n[\n  {\n    "day": 1,\n    "date": "YYYY-MM-DD",\n    "title": "當天主題",\n    "wishlistText": "",\n    "events": [\n      {\n        "time": "14:00",\n        "activity": "活動名稱",\n        "location": "地點名稱",\n        "note": "簡短備註"\n      }\n    ]\n  }\n]`;
              const result = await fetchGemini(promptText, systemPrompt, setTripStatus);
              
              const newTrip = { id: Date.now(), location: loc, days, startDate: start, arrivalTime, itineraryData: result };
              setTrips(prev => [...prev, newTrip]);
              setSelectedTripId(newTrip.id);
              callback && callback();
          } catch(e) {
              alert("生成失敗: " + e.message);
          } finally {
              setTripLoading(false);
          }
      };
      
      const updateEvent = useCallback((tripId, dayIdx, eventIdx, field, value) => {
        setTrips(prev => prev.map(trip => {
          if (trip.id === tripId) {
            if (!trip.itineraryData || !trip.itineraryData[dayIdx] || !trip.itineraryData[dayIdx].events) return trip;
            const newData = [...trip.itineraryData];
            const newDay = {...newData[dayIdx]};
            const newEvents = [...newDay.events];
            newEvents[eventIdx] = {...newEvents[eventIdx], [field]: value};
            newDay.events = newEvents;
            newData[dayIdx] = newDay;
            return { ...trip, itineraryData: newData };
          }
          return trip;
        }));
      }, []);

      const updateDayWishlist = useCallback((tripId, dayIdx, text) => {
          setTrips(prev => prev.map(trip => {
              if (trip.id === tripId) {
                  const newData = [...trip.itineraryData];
                  newData[dayIdx] = { ...newData[dayIdx], wishlistText: text };
                  return { ...trip, itineraryData: newData };
              }
              return trip;
          }));
      }, []);

      const optimizeDayRoute = useCallback(async (tripId, dayIdx, currentEvents, wishlistText) => {
          try {
              const systemPrompt = `你是一位專業的行程路線規劃師。請回傳一個 JSON 陣列 (Array)，不要包含其他多餘的文字。格式：[{"time":"10:00", "activity":"...", "location":"...", "note":"..."}]`;
              const userPrompt = `
              請幫我重新安排以下行程的順序，使其在地理位置上最順路。
              目前已排定的地點：${JSON.stringify(currentEvents)}
              另外我還想加入這些心願(美食/景點)：${wishlistText || '無'}
              請結合上述兩者，安排出一個最順路的行程表，並分配合理的時間。
              `;
              
              const optimizedEvents = await fetchGemini(userPrompt, systemPrompt);
              
              setTrips(prev => prev.map(trip => {
                  if (trip.id === tripId) {
                      const newData = [...trip.itineraryData];
                      newData[dayIdx] = { ...newData[dayIdx], events: optimizedEvents };
                      return { ...trip, itineraryData: newData };
                  }
                  return trip;
              }));
          } catch(e) {
              alert("排路順失敗: " + e.message);
          }
      }, []);

      const reorderEvent = useCallback((tripId, sourceDayIdx, sourceEventIdx, targetDayIdx, targetEventIdx) => {
        setTrips(prev => prev.map(trip => {
          if (trip.id === tripId) {
            const newData = [...trip.itineraryData];
            const sourceDay = {...newData[sourceDayIdx]};
            const targetDay = {...newData[targetDayIdx]};

            const sourceEvents = [...(sourceDay.events || [])];
            let targetEvents = sourceDayIdx === targetDayIdx ? sourceEvents : [...(targetDay.events || [])];

            const [draggedItem] = sourceEvents.splice(sourceEventIdx, 1);
            targetEvents.splice(targetEventIdx, 0, draggedItem);

            sourceDay.events = sourceEvents;
            if (sourceDayIdx !== targetDayIdx) {
                targetDay.events = targetEvents;
                newData[targetDayIdx] = targetDay;
            }
            newData[sourceDayIdx] = sourceDay;

            return { ...trip, itineraryData: newData };
          }
          return trip;
        }));
      }, []);

      const addEvent = useCallback((tripId, dayIdx) => {
        setTrips(prev => prev.map(trip => {
          if (trip.id === tripId) {
            const newData = [...trip.itineraryData];
            const newDay = {...newData[dayIdx]};
            const newEvents = [...(newDay.events || [])];
            newEvents.push({ time: "自訂", activity: "新行程名稱", location: "", note: "" });
            newDay.events = newEvents;
            newData[dayIdx] = newDay;
            return { ...trip, itineraryData: newData };
          }
          return trip;
        }));
      }, []);

      const deleteEvent = useCallback((tripId, dayIdx, eventIdx) => {
        setTrips(prev => prev.map(trip => {
          if (trip.id === tripId) {
            const newData = [...trip.itineraryData];
            const newDay = {...newData[dayIdx]};
            const newEvents = newDay.events.filter((_, i) => i !== eventIdx);
            newDay.events = newEvents;
            newData[dayIdx] = newDay;
            return { ...trip, itineraryData: newData };
          }
          return trip;
        }));
      }, []);

      const deleteTrip = (id) => {
          setTrips(prev => prev.filter(t => t.id !== id));
          if(selectedTripId === id) setSelectedTripId(null);
      };

      const getNearbyFood = () => {
          if(!navigator.geolocation) return alert("無定位權限");
          setFoodLoading(true);
          setFoodStatus("定位中...");
          navigator.geolocation.getCurrentPosition(async pos => {
              const { latitude, longitude } = pos.coords;
              setFoodStatus(`定位成功，搜尋周邊美食...`);
              try {
                  const res = await fetchGemini(`推薦 (${latitude},${longitude}) 附近5家美食。 請嚴格輸出 JSON 陣列，格式: [{name, rating, type, reason, address, tips}]`);
                  const enhancedRes = (Array.isArray(res) ? res : []).map(item => ({ ...item, type: 'food', subType: item.type }));
                  setNearbyFood(enhancedRes);
                  setFoodStatus("");
              } catch(e){ 
                  alert("搜尋失敗: " + e.message); 
                  setFoodStatus("搜尋失敗");
              } finally { 
                  setFoodLoading(false); 
              }
          }, (err) => {
              setFoodLoading(false);
              setFoodStatus("定位失敗");
              alert("定位失敗: " + err.message);
          });
      };
      
      const getNearbySpots = () => {
          if(!navigator.geolocation) return alert("無定位權限");
          setFoodLoading(true);
          setFoodStatus("定位中...");
          navigator.geolocation.getCurrentPosition(async pos => {
              const { latitude, longitude } = pos.coords;
              setFoodStatus(`定位成功，搜尋浪漫景點...`);
              try {
                  const res = await fetchGemini(`推薦 (${latitude},${longitude}) 附近3個適合蜜月拍照或浪漫約會的景點。 請嚴格輸出 JSON 陣列，格式: [{name, rating, type: "spot", description, address, tips}]`);
                  const enhancedRes = (Array.isArray(res) ? res : []).map(item => ({ ...item, type: 'spot', subType: '景點' }));
                  setNearbyFood(enhancedRes); 
                  setFoodStatus("");
              } catch(e){ 
                  alert("搜尋失敗: " + e.message); 
                  setFoodStatus("搜尋失敗");
              } finally { 
                  setFoodLoading(false); 
              }
          }, (err) => {
              setFoodLoading(false);
              setFoodStatus("定位失敗");
              alert("定位失敗: " + err.message);
          });
      };
      
      const handleGenerateJournal = async (keywords) => {
          setJournalLoading(true);
          try {
              const res = await fetchGemini(
                  `請根據關鍵字「${keywords}」寫一篇繁體中文的蜜月日記，語氣浪漫、溫馨，約50-80字。輸出 JSON 格式: { "content": "日記內容..." }`
              );
              if (res && res.content) {
                  const newMemo = { id: Date.now(), text: res.content };
                  setMemos(prev => [...prev, newMemo]);
              }
          } catch (e) {
              alert("生成失敗");
          } finally {
              setJournalLoading(false);
          }
      };

      return (
        <div className="min-h-screen pb-24 font-sans">
          <header className="bg-white border-b p-4 text-center sticky top-0 z-50 shadow-sm flex justify-between items-center px-6">
             <div className="flex items-center gap-2">
                 <Heart className="text-pink-500 fill-pink-500 w-6 h-6"/>
                 <h1 className="font-bold text-lg text-slate-800">蜜月管家</h1>
             </div>
             
             {status === 'loading' && <div className="flex items-center gap-2 text-xs text-slate-400"><Loader2 className="w-3 h-3 animate-spin"/> 連線中...</div>}
             {status === 'ready' && <div className="flex items-center gap-2 text-xs text-green-500"><div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"/> 已連線</div>}
             {status === 'error' && <button onClick={()=>window.location.reload()} className="flex items-center gap-1 text-xs text-red-500 bg-red-50 px-2 py-1 rounded"><AlertCircle className="w-3 h-3"/> 重試</button>}
          </header>

          <main className="max-w-4xl mx-auto p-4">
            {status === 'error' && (
                <div className="bg-red-100 border border-red-200 text-red-700 p-4 rounded-xl mb-4 text-center">
                    <p className="font-bold">連線發生錯誤</p>
                    <p className="text-sm">{errorMsg}</p>
                    <p className="text-xs mt-2 text-red-500">請確認 Firebase Console > Authentication > Sign-in method > Anonymous 已開啟</p>
                </div>
            )}

            {activeTab === 'planner' && <NewPlannerTab 
                trips={trips} 
                selectedTripId={selectedTripId} 
                setSelectedTripId={setSelectedTripId}
                deleteTrip={deleteTrip}
                onAddTrip={handleAddTrip}
                loading={tripLoading}
                loadingStatus={tripStatus}
                updateEvent={updateEvent}
                addEvent={addEvent}
                deleteEvent={deleteEvent}
                reorderEvent={reorderEvent}
                updateDayWishlist={updateDayWishlist}
                optimizeDayRoute={optimizeDayRoute}
            />}

            {activeTab === 'bookings' && <BookingsTab 
                flights={flights} setFlights={setFlights}
                hotels={hotels} setHotels={setHotels}
            />}

            {activeTab === 'food' && <FoodTab 
                getNearbyFood={getNearbyFood} 
                getNearbySpots={getNearbySpots}
                loading={foodLoading} 
                nearbyFood={nearbyFood} 
                foodStatus={foodStatus}
                exploreMode={exploreMode}
                setExploreMode={setExploreMode}
            />}
            
            {activeTab === 'prep' && <PrepTab 
                packingList={packingList} setPackingList={setPackingList} deletePackingItem={(id)=>setPackingList(p=>p.filter(i=>i.id!==id))}
                newItemText={newItemText} setNewItemText={setNewItemText} addPackingItem={()=>{if(newItemText){setPackingList(p=>[...p,{id:Date.now(),text:newItemText}]);setNewItemText('')}}}
                memos={memos} setMemos={setMemos}
                suggestPackingItems={async ()=>{
                    setSuggestingItems(true);
                    try { 
                        const res = await fetchGemini('日本蜜月必備清單 JSON string array'); 
                        const safeList = (Array.isArray(res) ? res : []).map(t => {
                            let textVal = t;
                            if (typeof t === 'object' && t !== null) textVal = t.item || t.text || t.name || JSON.stringify(t);
                            return {id: Math.random(), text: String(textVal), checked: false};
                        });
                        setPackingList(p=>[...p, ...safeList]); 
                    } finally { setSuggestingItems(false); }
                }} suggestingItems={suggestingItems}
                weatherInfos={weatherInfos} 
                addWeatherLocation={async (city, delId)=>{
                    if(delId) return setWeatherInfos(p=>p.filter(i=>i.id!==delId));
                    setIsAddingWeather(true);
                    try { 
                        const res = await fetchGemini(`${city} 3月天氣. JSON format: {location, temp, weather, clothing, notes}`); 
                        setWeatherInfos(p=>[...p, {id:Date.now(), ...res}]); 
                    } catch(e) {
                        alert("無法獲取天氣資訊: " + e.message);
                    } finally { setIsAddingWeather(false); }
                }} 
                deleteWeatherLocation={(id) => setWeatherInfos(p=>p.filter(i=>i.id!==id))}
                isAddingWeather={isAddingWeather}
                onGenerateJournal={handleGenerateJournal}
                journalLoading={journalLoading}
            />}

            {activeTab === 'coupons' && <CouponsTab 
                coupons={coupons} setCoupons={setCoupons}
                showAddCoupon={showAddCoupon} setShowAddCoupon={setShowAddCoupon}
                newCouponForm={newCouponForm} setNewCouponForm={setNewCouponForm}
                handleImageUpload={(e)=>{if(e.target.files[0]) setNewCouponForm(p=>({...p, image: URL.createObjectURL(e.target.files[0])}))}}
                currency={currency} 
                handleCurrencyTwd={(v)=>setCurrency({twd: v, jpy: Math.round(v/EXCHANGE_RATE)})}
                handleCurrencyJpy={(v)=>setCurrency({jpy: v, twd: Math.round(v*EXCHANGE_RATE)})}
            />}

            {activeTab === 'translate' && <TranslateTab 
                transInput={transInput} setTransInput={setTransInput}
                handleTranslate={async ()=>{
                    setTranslating(true);
                    try { const res = await fetchGemini(`Translate "${transInput}" to Japanese JSON {japanese, romaji}`); setTransResult(res); } finally { setTranslating(false); }
                }} translating={translating} transResult={transResult}
            />}
          </main>

          <nav className="fixed bottom-0 w-full bg-white/90 backdrop-blur border-t p-2 flex justify-between px-3 sm:px-6 safe-area-bottom overflow-x-auto no-scrollbar">
             {['planner', 'bookings', 'food', 'prep', 'coupons', 'translate'].map(tab => (
                 <button key={tab} onClick={() => setActiveTab(tab)} className={`flex flex-col items-center gap-1 min-w-[3.5rem] ${activeTab===tab ? 'text-pink-600' : 'text-slate-400'}`}>
                    {tab==='planner' && <Calendar className="w-5 h-5"/>}
                    {tab==='bookings' && <Plane className="w-5 h-5"/>}
                    {tab==='food' && <Utensils className="w-5 h-5"/>}
                    {tab==='prep' && <ClipboardList className="w-5 h-5"/>}
                    {tab==='coupons' && <Ticket className="w-5 h-5"/>}
                    {tab==='translate' && <Languages className="w-5 h-5"/>}
                    <span className="text-[10px]">{tab==='planner'?'行程':tab==='bookings'?'機酒':tab==='food'?'探索':tab==='prep'?'準備':tab==='coupons'?'優惠':'翻譯'}</span>
                 </button>
             ))}
          </nav>
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
